# =============================================================================
# llama.cpp server — local inference endpoint
#
# Usage:
#   docker compose up -d          # start server
#   docker compose logs -f        # watch logs
#   docker compose down           # stop
#
# The server exposes an OpenAI-compatible API at http://localhost:8080/v1
# =============================================================================

services:
  llama-server:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: llama-server
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ./models:/models:ro

    # ---- Tunable parameters ----
    # Defaults are conservative: ctx=2048, parallel=1, GPU=-1 (all layers)
    # Adjust via environment or override in docker-compose.override.yml
    command: >
      --model /models/${LLAMA_MODEL:-qwen2.5-7b-instruct-q4_k_m.gguf}
      --host 0.0.0.0
      --port 8080
      --ctx-size ${LLAMA_CTX:-2048}
      --n-predict ${LLAMA_MAX_TOKENS:-1024}
      --parallel ${LLAMA_PARALLEL:-1}
      --n-gpu-layers ${LLAMA_GPU_LAYERS:--1}
      --threads ${LLAMA_THREADS:-4}
      --batch-size ${LLAMA_BATCH:-512}
      --flash-attn
      --log-disable

    # ---- GPU passthrough (NVIDIA) ----
    # Comment out the deploy section if running CPU-only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # ---- Health check ----
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    environment:
      - LLAMA_MODEL=${LLAMA_MODEL:-qwen2.5-7b-instruct-q4_k_m.gguf}
